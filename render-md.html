<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rubric</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
        color: #1a1a1a;
    }
    table {
        border-collapse: collapse;
        width: 100%;
        margin: 1.5em 0;
    }
    th, td {
        border: 1px solid #ccc;
        padding: 8px 12px;
        text-align: left;
        vertical-align: top;
    }
    th {
        background-color: #f4f4f4;
    }
    code {
        background-color: #f4f4f4;
        padding: 2px 5px;
        border-radius: 3px;
    }
    pre {
        background-color: #f4f4f4;
        padding: 12px;
        border-radius: 5px;
        overflow-x: auto;
    }
</style>
</head>
<body>

<div id="content">Loading…</div>

<script>
  // Path relative to this HTML file, in the same repo
  fetch('open-source-rubric.md')
    .then(res => {
      if (!res.ok) throw new Error('File not found: ' + res.status);
      return res.text();
    })
    .then(md => {
      document.getElementById('content').innerHTML = marked.parse(md);
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        '<p>Could not load the rubric: ' + err.message + '</p>';
    });
</script>

</body>
</html>
